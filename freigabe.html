<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bestellfreigabe – Conrad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="site-header"></div>
<div id="page"></div>

<script src="assets/header.js"></script>
<script src="assets/app.js"></script>
<script>
const { eur, esc, BUYER } = App;
const TOKEN = new URLSearchParams(location.search).get('token');
App.mountHeader({ hideCart: true, hideMail: true });
App.mountDemoBar();

let lastItems = null;   // for live-change highlighting
let lastMode = null;

function mode(s) {
  const r = s.request;
  if (!TOKEN || !r || r.token !== TOKEN) return 'invalid';
  if (r.status === 'withdrawn') return 'withdrawn';
  if (Date.now() > r.expiresAt) return 'invalid';
  return r.status; // pending | approved | rejected
}

function emptyState(title, text) {
  return `<div class="main" style="grid-template-columns:1fr;max-width:720px"><div class="card empty-state">
    <span class="empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/><path d="M3 3l18 18"/></svg></span>
    <h1>${title}</h1><p>${text}</p></div></div>`;
}

function itemsHtml(items, prev) {
  const prevMap = prev ? Object.fromEntries(prev.map(i => [i.sku, i.qty])) : null;
  return items.map(i => {
    const changed = prevMap && prevMap[i.sku] !== i.qty;
    return `<div class="ro-item${changed ? ' changed' : ''}">
      ${App.img(i, 64)}
      <div>
        <div class="item-name">${esc(i.name)}</div>
        <div class="ro-meta"><span>Bestell-Nr.: ${i.sku}</span><span>${esc(i.delivery)}</span></div>
        <div class="ro-meta" style="margin-top:4px"><span>Menge: <span class="ro-qty">${i.qty} Stück</span></span></div>
      </div>
      <div class="ro-price"><div class="line">${eur(i.unitPrice * i.qty)}</div><div class="unit">${eur(i.unitPrice)} / Stück</div></div>
    </div>`;
  }).join('') || '<div class="ro-item" style="grid-template-columns:1fr"><span class="ro-meta">Der Warenkorb ist derzeit leer.</span></div>';
}

function totalsHtml(t) {
  return `<div class="summary-row"><span>Nettopreis</span><span>${eur(t.net)}</span></div>
    <div class="summary-row"><span>Versand</span>${t.shipping ? `<span>${eur(t.shipping)}</span>` : '<span class="summary-free">Kostenfrei</span>'}</div>
    <div class="summary-row"><span>MwSt. (19 %)</span><span>${eur(t.vat)}</span></div>
    <div class="summary-row total"><span>Gesamtpreis</span><span>${eur(t.gross)}</span></div>
    <div class="summary-vat">inkl. MwSt.</div>`;
}

function panelHtml(s, m) {
  const r = s.request;
  if (m === 'pending') return `
    <h2 class="panel-title">Ihre Entscheidung</h2>
    <div id="totals">${totalsHtml(App.totals(s.cart.items))}</div>
    <hr class="divider">
    <label class="field" id="nameField">
      <span class="field-label">Ihr Name</span>
      <input class="input" id="apName" autocomplete="name" placeholder="z. B. Thomas Becker">
      <span class="field-error">Bitte geben Sie Ihren Namen an, damit ${esc(BUYER.name.split(' ')[0])} weiß, wer geantwortet hat.</span>
    </label>
    <label class="field">
      <span class="field-label">Nachricht an ${esc(BUYER.name)} <span class="opt">(optional)</span></span>
      <textarea class="textarea" id="apMsg" maxlength="500" placeholder="z. B. Passt, bitte bis Freitag bestellen."></textarea>
    </label>
    <div class="decision-row">
      <button class="btn btn-danger" data-decide="rejected">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>Ablehnen</button>
      <button class="btn btn-primary" data-decide="approved">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Freigeben</button>
    </div>
    <div class="info-note"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span>${esc(BUYER.name)} erhält Ihre Antwort per E-Mail und schließt die Bestellung anschließend selbst ab. Mit der Freigabe wird noch keine Bestellung ausgelöst.</span></div>`;

  const ok = m === 'approved';
  return `
    <div style="text-align:center;padding:8px 0 16px">
      <span class="success-check" style="${ok ? '' : 'background:var(--c-error-bg);color:var(--c-error)'}">${ok
        ? '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
        : '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'}</span>
      <h2 class="panel-title" style="margin:16px 0 4px">${ok ? 'Bestellung freigegeben' : 'Bestellung abgelehnt'}</h2>
      <p style="margin:0;color:var(--fg-muted)">Ihre Antwort wurde am ${App.fmtDateTime(r.respondedAt)} an ${esc(BUYER.name)} gesendet.</p>
    </div>
    ${r.message ? `<div class="buyer-note"><div class="buyer-note-label">Ihre Nachricht</div>„${esc(r.message)}“</div>` : ''}
    <hr class="divider">
    <div id="totals">${totalsHtml(App.totals(r.snapshot))}</div>
    <p class="info-note" style="margin-top:8px">${ok ? `${esc(BUYER.name)} schließt die Bestellung selbst ab. Sie müssen nichts weiter tun.` : `${esc(BUYER.name)} kann den Warenkorb anpassen und Ihnen einen neuen Link senden.`}</p>`;
}

function render(fromRemote) {
  const s = App.load(), m = mode(s);
  const page = document.getElementById('page');
  if (m === 'invalid') { page.innerHTML = emptyState('Link ungültig oder abgelaufen', `Dieser Freigabe-Link ist nicht mehr gültig. Bitte wenden Sie sich an die Person, die Ihnen den Link gesendet hat.`); lastMode = m; return; }
  if (m === 'withdrawn') { page.innerHTML = emptyState('Anfrage zurückgezogen', `${esc(BUYER.name)} hat diese Freigabeanfrage zurückgezogen. Es ist keine Aktion mehr nötig.`); lastMode = m; return; }

  const r = s.request;
  const items = m === 'pending' ? s.cart.items : r.snapshot;
  const t = App.totals(items);

  // Pending + only cart changed: patch the list in place so the form keeps its input.
  if (lastMode === 'pending' && m === 'pending' && fromRemote) {
    document.getElementById('roList').innerHTML = itemsHtml(items, lastItems);
    document.getElementById('roCount').textContent = `${t.lines} Artikel · ${t.count} Stück`;
    document.getElementById('roStamp').textContent = 'Preise Stand ' + App.fmtTime(Date.now()) + ' Uhr';
    document.getElementById('totals').innerHTML = totalsHtml(t);
    document.getElementById('liveNotice').hidden = false;
    lastItems = items.map(i => ({ ...i }));
    return;
  }

  const initials = BUYER.name.split(' ').map(w => w[0]).join('');
  page.innerHTML = `<div class="main">
    <div>
      <div class="card" style="margin-bottom:16px">
        <div class="request-intro">
          <span class="avatar">${initials}</span>
          <div>
            <h1>${esc(BUYER.name)} bittet um Freigabe dieser Bestellung</h1>
            <p>${esc(BUYER.company)} · angefragt am ${App.fmtDateTime(r.createdAt)}</p>
          </div>
        </div>
        ${r.note ? `<div class="buyer-note"><div class="buyer-note-label">Nachricht von ${esc(BUYER.name.split(' ')[0])}</div>${esc(r.note)}</div>` : ''}
      </div>

      <div class="live-notice" id="liveNotice" hidden><span class="live-dot"></span>${esc(BUYER.name.split(' ')[0])} hat den Warenkorb gerade aktualisiert. Geänderte Positionen sind markiert.</div>

      <div class="ro-head">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <h2 class="cart-title" style="margin:0">Warenkorb</h2>
          <span class="status-pill readonly"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Schreibgeschützte Ansicht</span>
          ${m !== 'pending' ? `<span class="status-pill ${m}">${m === 'approved' ? 'Freigegeben' : 'Abgelehnt'}</span>` : ''}
        </div>
        <span class="ro-meta" id="roCount">${t.lines} Artikel · ${t.count} Stück</span>
      </div>
      <div class="card ro-list" style="padding:0">
        <div id="roList">${itemsHtml(items)}</div>
        <div class="ro-foot">
          <span id="roStamp">${m === 'pending' ? 'Preise Stand ' + App.fmtTime(Date.now()) + ' Uhr' : 'Stand Ihrer Antwort, ' + App.fmtDateTime(r.respondedAt)}</span>
          <span>Alle Preise netto zzgl. MwSt. · Link gültig bis ${App.fmtDate(r.expiresAt)}</span>
        </div>
      </div>
    </div>
    <div class="card" id="panel">${panelHtml(s, m)}</div>
  </div>`;
  lastItems = items.map(i => ({ ...i }));
  lastMode = m;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-decide]'); if (!b) return;
  const nameEl = document.getElementById('apName');
  const name = nameEl.value.trim();
  if (!name) { document.getElementById('nameField').classList.add('has-error'); nameEl.focus(); return; }
  App.respond(TOKEN, b.dataset.decide, name, document.getElementById('apMsg').value.trim());
  lastMode = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  App.toast('Antwort gesendet');
});
document.addEventListener('input', e => { if (e.target.id === 'apName') document.getElementById('nameField').classList.remove('has-error'); });

App.onChange(() => render(true));
render();
</script>
</body>
</html>
